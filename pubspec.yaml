name: doc_scanner_app
description: "Aplicación móvil para escaneo y procesamiento de documentos 100% offline y local."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Procesamiento de imagen y utilidades de cámara
  camera: ^0.11.0+2
  image: ^4.2.0
  google_mlkit_document_scanner: ^0.3.0
  
  # Generación y visualización de documentos PDF
  pdf: ^3.10.8
  printing: ^5.13.2
  
  # Almacenamiento local offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  
  # Compartición nativa y permisos
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  
  # Utilidades generales
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
